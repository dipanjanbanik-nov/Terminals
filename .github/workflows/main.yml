name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  SLN_FILE_PATH: Source\Terminals.sln

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v7
      - name: Setup-msbuild
        uses: microsoft/setup-msbuild@v3
      - name: Restore Packages
        run: msbuild ${{ env.SLN_FILE_PATH }} -t:Restore -p:RestorePackagesConfig=true -p:Configuration=DistributionRelease "-p:Platform=Any CPU"
      - name: Build solution and installer
        run: msbuild ${{ env.SLN_FILE_PATH }} -t:Rebuild -p:Configuration=DistributionRelease "-p:Platform=Any CPU" -p:SignOutput=false
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Terminals-installer
          path: Build\Output\Release\TerminalsSetup.msi
          if-no-files-found: error
      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1.3
      - name: Install a SQL Server suite of tools
        uses: potatoqualitee/mssqlsuite@v2
        with:
          install: localdb
          show-log: true
      - name: Test
        run: vstest.console.exe /logger:"trx;LogFileName=test_results.trx" Source\Tests\bin\Release\Tests.dll
      - name: Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure() # run this step even if previous step failed
        with:
          name: MSTests
          path: TestResults/test_results.trx
          reporter: dotnet-trx
